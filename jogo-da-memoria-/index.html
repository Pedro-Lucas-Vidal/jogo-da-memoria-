<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>   
  <section class="header">
    <h1>Jogo-da-memória</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span> 
    <hr color="Black"> 
  </section>

  <!-- Início do container principal -->

    <!-- Início das seções dos 12 cards-->

     <!--colocando imagem para os cards -->
      <img class="front-face" src="imagem/sherk.png" alt="avengers" />

    </section>

    <section class="memory-card" data-framework="black_panther">

    <section class="memory-card" data-framework="wolverine">

    </section>

      <img class="front-face" src="imagem/sherk.png" alt="Avengers" />

      <img class="front-face" src="imagem/sherk.png" />
